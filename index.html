<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101918">
  <meta name="description" content="The new AVOXT website is coming soon.">
  <title>AVOXT — Coming soon</title>
  <style>
    :root { color-scheme: dark; --bg: #101918; --fg: #f1f3ed; --muted: #a6b1aa; --accent: #c4e976; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: radial-gradient(ellipse at 75% 48%, #263d35 0, transparent 38%), var(--bg); color: var(--fg); font-family: Arial, Helvetica, sans-serif; }
    main { min-height: 100vh; width: min(1320px, 100%); margin: auto; padding: 0 7vw; display: flex; flex-direction: column; }
    header, footer { display: flex; align-items: center; justify-content: space-between; }
    header { height: 94px; border-bottom: 1px solid #ffffff20; }
    .wordmark { color: var(--fg); text-decoration: none; font-weight: 750; font-size: 23px; letter-spacing: .16em; }
    .label, footer { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
    .label { color: var(--muted); }
    .label i { display: inline-block; width: 7px; height: 7px; background: var(--accent); border-radius: 50%; margin-right: 10px; }
    .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 90px 0 110px; }
    .eyebrow { margin: 0 0 26px; color: var(--accent); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
    h1 { max-width: 900px; margin: 0; font-size: clamp(58px, 10.5vw, 142px); font-weight: 600; line-height: .92; letter-spacing: -.075em; }
    h1 span { color: var(--accent); }
    .support { max-width: 410px; margin: 34px 0 0; color: var(--muted); font-size: 17px; line-height: 1.65; }
    .rule { width: min(380px, 100%); height: 2px; margin-top: 52px; background: #ffffff20; }
    .rule span { display: block; width: 38%; height: 100%; background: var(--accent); }
    footer { min-height: 68px; border-top: 1px solid #ffffff20; color: #89968e; }
    @media (max-width: 600px) { main { padding: 0 6vw; } header { height: 76px; } .label { max-width: 170px; text-align: right; line-height: 1.6; } .hero { padding: 70px 0 90px; } h1 { font-size: clamp(56px, 14vw, 88px); } .support { font-size: 15px; } footer { gap: 18px; font-size: 9px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <a class="wordmark" href="/" aria-label="AVOXT home">AVOXT</a>
      <span class="label"><i aria-hidden="true"></i>New website in progress</span>
    </header>
    <section class="hero" aria-labelledby="headline">
      <p class="eyebrow">A new chapter is taking shape</p>
      <h1 id="headline">AVOXT.<br><span>Coming soon.</span></h1>
      <p class="support">We’re preparing a new online home. Check back soon to see what’s next.</p>
      <div class="rule" aria-hidden="true"><span></span></div>
    </section>
    <footer><span>AVOXT</span><span>More soon</span></footer>
  </main>
</body>
</html>
